groups:
  - name: viztr-meet-alerts
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="viztr-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VizTR Backend is down"
          description: "Backend has been down for more than 1 minute"

      - alert: HighErrorRate
        expr: rate(viztr_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(viztr_transcription_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High transcription latency"
          description: "P95 transcription latency is {{ $value }}s"

      - alert: TooManyActiveSessions
        expr: viztr_active_sessions > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High concurrent sessions"
          description: "{{ $value }} active sessions"

      - alert: GPUMemoryHigh
        expr: (nvidia_gpu_memory_used_bytes / nvidia_gpu_memory_total_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory usage high"
          description: "GPU memory usage is {{ $value | humanizePercentage }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"
          description: "Less than 10% disk space remaining"