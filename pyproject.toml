[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "viztrmeet"
version = "0.1.0"
description = "Real-time audio translation platform for meetings"
authors = ["VizTR Team <team@viztr-meet.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/your-org/viztr-meet"
documentation = "https://github.com/your-org/viztr-meet"
keywords = ["translation", "speech", "real-time", "webrtc", "websocket"]
packages = [{ include = "viztrmeet", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.8.0"
torch = "^2.6.0"
torchaudio = "^2.6.0"
noisereduce = "^3.0.0"
pyjwt = "^2.10.0"
websockets = "^13.1.0"
livekit = "^1.3.0"
python-dotenv = "^1.0.0"
prometheus-client = "^0.20.0"
redis = "^5.0.1"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.32"
alembic = "^1.13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
black = "^25.1.0"
isort = "^5.13.0"
mypy = "^1.15.0"
ruff = "^0.9.0"
pre-commit = "^4.0.0"

[tool.poetry.urls]
Documentation = "https://github.com/your-org/viztr-meet"
Repository = "https://github.com/your-org/viztr-meet"
Issues = "https://github.com/your-org/viztr-meet/issues"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.py$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
skip_gitignore = true
profile = "black"
force_single_line = true
include_trailing_comma = true
lines_after_imports = 2
lines_between_types = 1
force_sort_within_sections = true

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "C90", "UP", "B"]
ignore = []
exclude = [".git", ".tox", ".venv", "__pycache__", ".eggs", "build"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "tests/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/viztrmeet"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__",
    "if __name__ == \"__main__\"",
]